name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apk.yml'
      - 'launcher/**'
      - '.signing/**'
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-34 build-tools;34.0.0
      - name: Use the fixed signing key, so updates install over the old version
        run: mkdir -p ~/.android && cp .signing/debug.keystore ~/.android/debug.keystore
      - name: Build
        working-directory: launcher
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: launcher-apk
          path: launcher/app/build/outputs/apk/release/app-release.apk
